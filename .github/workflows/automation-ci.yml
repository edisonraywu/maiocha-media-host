name: Multi-brand automation checks
on:
  push:
    branches: [main]
    paths: ['automation/**', 'tests/**', 'config/**', 'requirements-automation.txt', '.github/workflows/**']
  pull_request:
    paths: ['automation/**', 'tests/**', 'config/**', 'requirements-automation.txt', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - run: python -m pip install -r requirements-automation.txt
      - run: python -m unittest discover -s tests -v

